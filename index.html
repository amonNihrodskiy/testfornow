<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Heart Jump 💕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: #1a0010;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  color: #fff;
}

#game-wrapper {
  position: relative;
  width: 100vw;
  height: 100dvh;
  max-width: 430px;
  overflow: hidden;
  background: linear-gradient(180deg, #1a0010 0%, #3d0030 60%, #5c0045 100%);
  box-shadow: 0 0 50px rgba(0,0,0,0.5);
}

canvas { display: block; width: 100%; height: 100%; }

/* HUD */
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 10;
  pointer-events: none;
}
#score-val { font-size: 2rem; font-weight: 900; color: #ffcce6; text-shadow: 0 0 10px #ff69b4; }
#total-val { font-size: 0.8rem; opacity: 0.8; color: #ff9ec8; }

#boost-hud {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 2rem;
  z-index: 10;
}

/* Screens */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  background: rgba(26, 0, 16, 0.85);
  backdrop-filter: blur(8px);
  padding: 20px;
  text-align: center;
}

h1 { font-size: 2.5rem; color: #ffcce6; text-shadow: 0 0 20px #ff69b4; margin-bottom: 10px; }
.subtitle { color: #ff9ec8; margin-bottom: 30px; font-size: 1rem; }

.btn {
  background: linear-gradient(135deg, #ff5fa0, #e0105a);
  color: #fff;
  font-size: 1.1rem;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  padding: 12px 35px;
  margin: 8px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(224, 16, 90, 0.4);
  width: 220px;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
.btn.secondary { background: transparent; border: 2px solid #ff5fa0; color: #ff9ec8; box-shadow: none; }

/* Skins Grid */
.skins-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
  width: 100%;
  max-width: 320px;
}
.skin-item {
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid transparent;
  border-radius: 15px;
  padding: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: 0.2s;
}
.skin-item.locked { opacity: 0.4; filter: grayscale(1); }
.skin-item.selected { border-color: #ff5fa0; background: rgba(255, 95, 160, 0.2); }
.skin-icon { font-size: 1.8rem; margin-bottom: 5px; }
.skin-price { font-size: 0.65rem; color: #ff9ec8; }

/* Achievements List */
.ach-list {
  width: 100%;
  max-height: 350px;
  overflow-y: auto;
  margin-bottom: 20px;
  padding-right: 5px;
}
.ach-item {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 15px;
  text-align: left;
  border-left: 4px solid #555;
}
.ach-item.unlocked { border-left-color: #ff5fa0; background: rgba(255, 95, 160, 0.1); }
.ach-icon { font-size: 1.5rem; }
.ach-info b { display: block; font-size: 0.9rem; color: #ffcce6; }
.ach-info span { font-size: 0.75rem; color: #ff9ec8; opacity: 0.8; }

/* Toast Achievement */
#ach-toast {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: linear-gradient(135deg, #ff5fa0, #e0105a);
  padding: 12px 20px;
  border-radius: 15px;
  z-index: 100;
  opacity: 0;
  transition: 0.5s;
  pointer-events: none;
  width: 80%;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}
#ach-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#desktop-msg { display: none; text-align: center; padding: 20px; color: #ffcce6; }

@media (min-width: 600px) and (min-height: 600px) {
  #game-wrapper { display: none; }
  #desktop-msg { display: block; }
}
</style>
</head>
<body>

<div id="desktop-msg">
  <h1>📱💕</h1>
  <p>Эта игра создана для телефона.<br>Пожалуйста, открой её на смартфоне, чтобы играть наклонами!</p>
</div>

<div id="game-wrapper">
  <div id="hud" style="display:none">
    <div id="score-val">0</div>
    <div id="total-val">всего: 0</div>
  </div>
  <div id="boost-hud"></div>

  <canvas id="gameCanvas"></canvas>

  <!-- Главное меню -->
  <div class="screen" id="menu-screen">
    <h1>Heart Jump</h1>
    <div class="subtitle">для самой любимой девочки 💕</div>
    <button class="btn" onclick="startGame()">Новая игра</button>
    <button class="btn secondary" onclick="showScreen('skins-screen')">Скины</button>
    <button class="btn secondary" onclick="showScreen('ach-screen')">Достижения</button>
  </div>

  <!-- Скины -->
  <div class="screen" id="skins-screen" style="display:none">
    <h1>Выбери образ</h1>
    <div class="skins-grid" id="skins-grid"></div>
    <button class="btn secondary" onclick="showScreen('menu-screen')">Назад</button>
  </div>

  <!-- Достижения -->
  <div class="screen" id="ach-screen" style="display:none">
    <h1>Твои успехи</h1>
    <div class="ach-list" id="ach-list"></div>
    <button class="btn secondary" onclick="showScreen('menu-screen')">Назад</button>
  </div>

  <!-- Конец игры -->
  <div class="screen" id="gameover-screen" style="display:none">
    <h1 id="go-title">Упс! 💔</h1>
    <div class="subtitle" id="go-score-msg">Ты пролетела 0 метров</div>
    <button class="btn" onclick="startGame()">Еще раз</button>
    <button class="btn secondary" onclick="showScreen('menu-screen')">В меню</button>
  </div>

  <div id="ach-toast"></div>
</div>

<script>
// ===================== НАСТРОЙКИ И ДАННЫЕ =====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const PLAT_W = 75;
const PLAT_H = 15;
const GRAVITY = 0.35;
const JUMP_FORCE = -11;
const SPRING_FORCE = -18;

// Типы платформ
const PT = { NORMAL: 0, LOOSE: 1, FRAGILE: 2, LIFT: 3, STAR: 4 };
// Типы бустеров
const BT = { SPRING: 0, ROCKET: 1, MAGNET: 2 };

// Скины
const SKINS = [
  { id: 'red', char: '❤️', title: 'Классика', type: 'emoji', req: 0 },
  { id: 'pink', char: '💕', title: 'Нежность', type: 'emoji', req: 500, reqType: 'best' },
  { id: 'cat', char: '😻', title: 'Котик', type: 'emoji', req: 5000, reqType: 'total' },
  { id: 'sun', char: '☀️', title: 'Солнышко', type: 'emoji', req: 15000, reqType: 'total' },
  { id: 'queen', char: '👑', title: 'Королева', type: 'emoji', req: 50000, reqType: 'total' },
  { id: 'vika', char: 'vika.png', title: 'Моя Вика', type: 'image', req: 1000000, reqType: 'total' }
];

// Достижения
const ACHIEVEMENTS = [
  { id: 'first', icon: '💝', title: 'Начало пути', desc: 'Сделать первый прыжок', req: 1, type: 'games' },
  { id: 'm100', icon: '🌸', title: 'Цветочек', desc: 'Набрать 100 метров', req: 100, type: 'best' },
  { id: 'm500', icon: '✨', title: 'Сияние', desc: 'Набрать 500 метров', req: 500, type: 'best' },
  { id: 'm1000', icon: '🌙', title: 'Лунная призма', desc: 'Набрать 1000 метров', req: 1000, type: 'best' },
  { id: 'sum10k', icon: '🍭', title: 'Сладкоежка', desc: '10,000 очков в сумме', req: 10000, type: 'total' },
  { id: 'sum100k', icon: '🔥', title: 'Неудержимая', desc: '100,000 очков в сумме', req: 100000, type: 'total' },
  { id: 'sum1m', icon: '💎', title: 'Моя Вселенная', desc: 'Собрать 1,000,000 очков', req: 1000000, type: 'total' },
];

// Состояние
let score = 0;
let bestScore = parseInt(localStorage.getItem('hj_best') || '0');
let totalScore = parseInt(localStorage.getItem('hj_total') || '0');
let gamesPlayed = parseInt(localStorage.getItem('hj_games') || '0');
let unlockedAchs = JSON.parse(localStorage.getItem('hj_achs') || '[]');
let currentSkin = localStorage.getItem('hj_skin') || 'red';

let gameState = 'menu';
let cameraY = 0;
let player, platforms, boosts, particles;
let tilt = 0;
let rocketTimer = 0, magnetTimer = 0;
let vikaImg = new Image(); vikaImg.src = 'vika.png';

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
function resize() {
  canvas.width = Math.min(window.innerWidth, 430);
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Управление наклоном
window.addEventListener('deviceorientation', e => {
  if (e.gamma !== null) tilt = Math.max(-1, Math.min(1, e.gamma / 25));
});

// Клик для старта (фиктивно для iOS)
document.addEventListener('touchstart', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission();
  }
}, { once: true });

// ===================== ЛОГИКА ИГРЫ =====================
function startGame() {
  score = 0;
  cameraY = 0;
  rocketTimer = 0;
  magnetTimer = 0;
  platforms = [];
  boosts = [];
  particles = [];
  
  // Игрок
  player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 150,
    w: 40, h: 40,
    vx: 0, vy: JUMP_FORCE
  };

  // Начальная платформа
  platforms.push({ x: canvas.width / 2 - PLAT_W / 2, y: canvas.height - 100, type: PT.NORMAL, used: false, opacity: 1 });

  // Генерация первых платформ
  for (let i = 0; i < 15; i++) {
    spawnPlatform(canvas.height - 200 - (i * 80));
  }

  gamesPlayed++;
  localStorage.setItem('hj_games', gamesPlayed);
  checkAchievements();

  gameState = 'playing';
  showScreen('none');
  document.getElementById('hud').style.display = 'block';
  updateHUD();
}

function spawnPlatform(y) {
  const x = Math.random() * (canvas.width - PLAT_W - 20) + 10;
  let type = PT.NORMAL;
  const roll = Math.random();

  if (score > 200) {
    if (roll < 0.15) type = PT.LIFT;
    else if (roll < 0.3) type = PT.FRAGILE;
    else if (roll < 0.4) type = PT.LOOSE;
  }
  if (Math.random() < 0.05) type = PT.STAR;

  platforms.push({ x, y, type, used: false, opacity: 1, 
    side: Math.random() < 0.5 ? 1 : -1, 
    origX: x 
  });

  // Бустеры (не сразу)
  if (score > 100 && Math.random() < 0.08) {
    const bType = Math.random() < 0.6 ? BT.SPRING : (Math.random() < 0.5 ? BT.ROCKET : BT.MAGNET);
    boosts.push({ x: x + PLAT_W / 2 - 10, y: y - 25, type: bType, active: true });
  }
}

function update() {
  if (gameState !== 'playing') return;

  // Движение
  player.vx = tilt * 8;
  if (!rocketTimer) player.vy += GRAVITY;
  else {
    player.vy = -10;
    rocketTimer--;
  }

  player.x += player.vx;
  player.y += player.vy;

  // Магнит
  if (magnetTimer > 0) {
    magnetTimer--;
    boosts.forEach(b => {
      if (b.active && Math.abs(b.y - player.y) < 300) {
        b.x += (player.x - b.x) * 0.1;
        b.y += (player.y - b.y) * 0.1;
      }
    });
  }

  // Сквозной экран
  if (player.x > canvas.width) player.x = -player.w;
  if (player.x < -player.w) player.x = canvas.width;

  // Камера
  if (player.y < cameraY + canvas.height * 0.4) {
    cameraY = player.y - canvas.height * 0.4;
  }

  // Очки (высота)
  let currentHeight = Math.floor(Math.abs(cameraY) / 10);
  if (currentHeight > score) {
    score = currentHeight;
    updateHUD();
  }

  // Платформы
  platforms.forEach(p => {
    // Коллизия (только если падаем вниз)
    if (player.vy > 0 && 
        player.x + 10 < p.x + PLAT_W && 
        player.x + player.w - 10 > p.x && 
        player.y + player.h > p.y && 
        player.y + player.h < p.y + PLAT_H + player.vy + 2) {
      
      if (p.opacity > 0.5) {
        if (p.type === PT.LOOSE) { p.used = true; player.vy = JUMP_FORCE; }
        else if (p.type === PT.FRAGILE) { p.used = true; player.vy = JUMP_FORCE; }
        else if (p.type === PT.STAR) { 
           player.vy = JUMP_FORCE; 
           if (!p.used) { score += 50; p.used = true; createBurst(p.x + PLAT_W/2, p.y, '#ffd700'); }
        }
        else { player.vy = JUMP_FORCE; }
      }
    }

    // Спец эффекты платформ
    if (p.type === PT.LIFT) {
      p.x += p.side * 2;
      if (p.x < 0 || p.x > canvas.width - PLAT_W) p.side *= -1;
    }
    if (p.used && p.type === PT.FRAGILE) p.opacity -= 0.1;
    if (p.used && p.type === PT.LOOSE) p.y += 10;
  });

  // Сбор бустеров
  boosts.forEach(b => {
    if (b.active && 
        player.x < b.x + 20 && player.x + player.w > b.x && 
        player.y < b.y + 20 && player.y + player.h > b.y) {
      b.active = false;
      if (b.type === BT.SPRING) player.vy = SPRING_FORCE;
      if (b.type === BT.ROCKET) rocketTimer = 200;
      if (b.type === BT.MAGNET) magnetTimer = 500;
      createBurst(b.x, b.y, '#fff');
    }
  });

  // Очистка и спавн новых платформ
  platforms = platforms.filter(p => p.y - cameraY < canvas.height + 100);
  boosts = boosts.filter(b => b.y - cameraY < canvas.height + 100);
  
  if (platforms.length < 20) {
    let lastY = platforms[platforms.length - 1].y;
    spawnPlatform(lastY - 80);
  }

  // Смерть
  if (player.y - cameraY > canvas.height + 100) endGame();
}

function endGame() {
  gameState = 'gameover';
  totalScore += score;
  localStorage.setItem('hj_total', totalScore);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('hj_best', bestScore);
  }
  
  document.getElementById('go-score-msg').textContent = `Ты пролетела ${score} метров!`;
  document.getElementById('hud').style.display = 'none';
  showScreen('gameover-screen');
  checkAchievements();
}

// ===================== ОТРИСОВКА =====================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 'playing' || gameState === 'gameover') {
    // Платформы
    platforms.forEach(p => {
      ctx.globalAlpha = p.opacity;
      let color = '#ff5fa0';
      if (p.type === PT.LIFT) color = '#4facfe';
      if (p.type === PT.FRAGILE) color = '#a18cd1';
      if (p.type === PT.LOOSE) color = '#f093fb';
      if (p.type === PT.STAR) color = '#ffd700';

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y - cameraY, PLAT_W, PLAT_H, 8);
      ctx.fill();
      
      if (p.type === PT.STAR) {
        ctx.fillStyle = '#fff';
        ctx.font = '12px serif';
        ctx.fillText('⭐', p.x + PLAT_W/2 - 6, p.y - cameraY + 12);
      }
      ctx.globalAlpha = 1;
    });

    // Бустеры
    boosts.forEach(b => {
      if (!b.active) return;
      let emoji = '🌀';
      if (b.type === BT.ROCKET) emoji = '🚀';
      if (b.type === BT.MAGNET) emoji = '🧲';
      ctx.font = '24px serif';
      ctx.fillText(emoji, b.x, b.y - cameraY + 20);
    });

    // Игрок
    const skin = SKINS.find(s => s.id === currentSkin);
    if (skin.type === 'emoji') {
      ctx.font = '40px serif';
      ctx.textAlign = 'center';
      ctx.fillText(skin.char, player.x + player.w/2, player.y - cameraY + 35);
    } else {
      ctx.save();
      ctx.beginPath();
      ctx.arc(player.x + player.w/2, player.y - cameraY + player.h/2, 20, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(vikaImg, player.x, player.y - cameraY, 40, 40);
      ctx.restore();
    }
    
    if (rocketTimer > 0) {
        ctx.font = '20px serif';
        ctx.fillText('🔥', player.x + player.w/2, player.y - cameraY + 60);
    }
  }

  requestAnimationFrame(draw);
}

// ===================== UI И ДОСТИЖЕНИЯ =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
  if (id !== 'none') document.getElementById(id).style.display = 'flex';
  
  if (id === 'skins-screen') renderSkins();
  if (id === 'ach-screen') renderAchievements();
}

function updateHUD() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('total-val').textContent = `всего: ${totalScore.toLocaleString()}`;
}

function renderSkins() {
  const container = document.getElementById('skins-grid');
  container.innerHTML = '';
  SKINS.forEach(s => {
    let locked = false;
    if (s.reqType === 'best' && bestScore < s.req) locked = true;
    if (s.reqType === 'total' && totalScore < s.req) locked = true;
    
    const div = document.createElement('div');
    div.className = `skin-item ${locked ? 'locked' : ''} ${currentSkin === s.id ? 'selected' : ''}`;
    div.innerHTML = `
      <div class="skin-icon">${s.type === 'emoji' ? s.char : '🖼️'}</div>
      <div style="font-size:0.8rem; font-weight:bold">${s.title}</div>
      <div class="skin-price">${locked ? 'закрыто' : 'выбрано'}</div>
    `;
    if (!locked) div.onclick = () => { currentSkin = s.id; localStorage.setItem('hj_skin', s.id); renderSkins(); };
    container.appendChild(div);
  });
}

function renderAchievements() {
  const container = document.getElementById('ach-list');
  container.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = unlockedAchs.includes(a.id);
    const div = document.createElement('div');
    div.className = `ach-item ${unlocked ? 'unlocked' : ''}`;
    div.innerHTML = `
      <div class="ach-icon">${unlocked ? a.icon : '❓'}</div>
      <div class="ach-info">
        <b>${a.title}</b>
        <span>${unlocked ? a.desc : 'Нужно постараться...'}</span>
      </div>
    `;
    container.appendChild(div);
  });
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (unlockedAchs.includes(a.id)) return;
    
    let pass = false;
    if (a.type === 'best' && bestScore >= a.req) pass = true;
    if (a.type === 'total' && totalScore >= a.req) pass = true;
    if (a.type === 'games' && gamesPlayed >= a.req) pass = true;
    
    if (pass) {
      unlockedAchs.push(a.id);
      localStorage.setItem('hj_achs', JSON.stringify(unlockedAchs));
      showToast(a);
    }
  });
}

function showToast(a) {
  const toast = document.getElementById('ach-toast');
  toast.innerHTML = `<b>Достижение! ${a.icon}</b><br>${a.title}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function createBurst(x, y, color) {
  // Простая анимация частиц (по желанию можно расширить)
}

// Запуск
setInterval(update, 1000/60);
draw();

</script>
</body>
</html>
